[workspace]
resolver = "2"
members = ["crates/stint-core", "crates/stint"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alfieprojectsdev/stint"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.3"
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.33"
egui_extras = { version = "0.33", default-features = false }
open = "5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
