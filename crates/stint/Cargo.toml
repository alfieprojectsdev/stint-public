[package]
name = "stint"
description = "stint: time tracker + invoice tool (CLI; TUI/GUI/MCP front-ends land here too)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stint"
path = "src/main.rs"

[dependencies]
stint-core = { path = "../stint-core" }
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
tempfile = "3"
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
open = { workspace = true, optional = true }
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
schemars = { version = "1", optional = true }

[features]
default = ["gui", "mcp"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:open"]
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
rmcp = ["dep:rmcp"]
tokio = ["dep:tokio"]
schemars = ["dep:schemars"]
