[project]
name = "stintcore"
version = "0.1.0"
description = "stint time-tracker core + Textual TUI (freelance contractor tooling)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85",
    "anthropic>=0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stintcore"]

[dependency-groups]
dev = [
    "pytest>=8",
]
